name: Backend regression

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-regression.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check gateway structure
        run: node backend/static-check.mjs
