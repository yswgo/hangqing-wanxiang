name: Deploy Market Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-worker.yml'

concurrency:
  group: market-gateway-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      STOCKTODAY_TOKEN: ${{ secrets.STOCKTODAY_TOKEN }}
      WEBULL_APP_KEY: ${{ secrets.WEBULL_APP_KEY }}
      WEBULL_APP_SECRET: ${{ secrets.WEBULL_APP_SECRET }}
      WEBULL_ACCESS_TOKEN: ${{ secrets.WEBULL_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$ALPHA_VANTAGE_API_KEY" || (echo "Missing ALPHA_VANTAGE_API_KEY" && exit 1)
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Configure Alpha Vantage secret
        run: printf '%s' "$ALPHA_VANTAGE_API_KEY" | wrangler secret put ALPHA_VANTAGE_API_KEY
      - name: Configure Twelve Data secret when present
        shell: bash
        run: |
          if [ -n "$TWELVE_DATA_API_KEY" ]; then
            printf '%s' "$TWELVE_DATA_API_KEY" | wrangler secret put TWELVE_DATA_API_KEY
            echo "Twelve Data provider enabled."
          else
            echo "TWELVE_DATA_API_KEY not set; Alpha Vantage remains the US fallback."
          fi
      - name: Configure StockToday secret when present
        shell: bash
        run: |
          if [ -n "$STOCKTODAY_TOKEN" ]; then
            printf '%s' "$STOCKTODAY_TOKEN" | wrangler secret put STOCKTODAY_TOKEN
            echo "StockToday A-share provider enabled."
          else
            echo "STOCKTODAY_TOKEN not set; Tushare remains the CN fallback."
          fi
      - name: Configure Tushare secret when present
        shell: bash
        run: |
          if [ -n "$TUSHARE_TOKEN" ]; then
            printf '%s' "$TUSHARE_TOKEN" | wrangler secret put TUSHARE_TOKEN
            echo "Tushare A-share provider enabled."
          else
            echo "TUSHARE_TOKEN not set; CN provider fallback remains optional."
          fi
      - name: Configure Webull production credentials when present
        shell: bash
        run: |
          if [ -n "$WEBULL_APP_KEY" ] && [ -n "$WEBULL_APP_SECRET" ] && [ -n "$WEBULL_ACCESS_TOKEN" ]; then
            printf '%s' "$WEBULL_APP_KEY" | wrangler secret put WEBULL_APP_KEY
            printf '%s' "$WEBULL_APP_SECRET" | wrangler secret put WEBULL_APP_SECRET
            printf '%s' "$WEBULL_ACCESS_TOKEN" | wrangler secret put WEBULL_ACCESS_TOKEN
            echo "Webull production HK/CN provider enabled."
          else
            echo "Webull production credentials incomplete; HK/CN production routing stays disabled."
          fi
      - name: Validate Worker syntax
        run: node --check cloudflare-worker.js && node --check cloudflare-worker-v82.js
      - name: Deploy Worker
        run: wrangler deploy
      - name: Verify Worker configuration
        run: |
          echo "Deployment completed."
          echo "Check /ready and /health."
          echo "Sandbox test: /test/webull"
          echo "Production Webull tests after credentials are configured: /test/webull-prod?code=NVDA, /test/webull-prod?code=0700.HK, or /test/webull-prod?code=600519"
          echo "Unified quotes: /quotes?codes=NVDA,0700.HK,600519"
