name: Deploy Market Gateway

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$ALPHA_VANTAGE_API_KEY" || (echo "Missing ALPHA_VANTAGE_API_KEY" && exit 1)
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Configure Alpha Vantage secret
        run: printf '%s' "$ALPHA_VANTAGE_API_KEY" | wrangler secret put ALPHA_VANTAGE_API_KEY
      - name: Configure Twelve Data secret when present
        shell: bash
        run: |
          if [ -n "$TWELVE_DATA_API_KEY" ]; then
            printf '%s' "$TWELVE_DATA_API_KEY" | wrangler secret put TWELVE_DATA_API_KEY
            echo "Twelve Data provider enabled."
          else
            echo "TWELVE_DATA_API_KEY not set; Alpha Vantage remains the US provider."
          fi
      - name: Deploy Worker
        run: wrangler deploy
      - name: Verify Worker configuration
        run: echo "Deployment completed. Verify /health, /ready, /quotes?codes=NVDA and /history?code=NVDA&period=1d on the deployed workers.dev URL."
